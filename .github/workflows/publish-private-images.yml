name: Publish unified Auto Trader image

on:
  push:
    branches: [main, feature/truenas-running-baseline]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: auto-trader-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Enforce immutable stable version tags
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application test dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run install, setup, trading and security tests
        run: |
          python -m compileall -q app installer ai-workstation
          python -m unittest discover -s installer -v
          python -m unittest discover -s app -q
          python -m unittest discover -s app -p test_unified_setup.py -v
          python -m unittest discover -s app -p test_password_policy_ui.py -v
          python -m unittest discover -s app -p test_broker_workspace.py -v
          python -m unittest discover -s app -p test_built_in_forecast.py -v
          python -m unittest discover -s app -p test_forecast_connection.py -v
          python -m unittest discover -s app -p test_v107_setup_fixes.py -v
          python -m unittest discover -s app -p test_profile_update.py -v
          python -m unittest discover -s app -p test_sidebar_version.py -v
          python -m unittest discover -s app -p test_market_oauth.py -v
          python -m unittest discover -s app -p test_frontend_v2.py -v
          python -m unittest discover -s app -p test_workspace_tiles.py -v
          python -m unittest discover -s app -p test_workspace_branding.py -v
          python -m unittest discover -s app -p test_https.py -v
          python -m unittest discover -s app -p test_update_checker.py -v
          python -m unittest discover -s ai-workstation -p test_model_monitor.py -v
          node --check web/app.js
          node --check web/setup.js
          node tests/test_setup_pages.cjs
          node tests/test_workspace_balances.cjs
          node tests/test_main_overview.cjs
          node tests/test_ai_header_refresh.cjs
          node tests/test_ui_audit_contract.cjs
          node tests/test_verified_brokers.cjs
          node tests/test_robinhood_tile_value.cjs
          node tests/test_robinhood_performance_ui.cjs
          node tests/test_webull_workspace_tile.cjs
          node --check web/brokers.js
          node --check web/setup.js
          node --check web/forecast.js
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check UI-only stable refresh
        id: visual
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          # Never change trading modules or config in an unversioned UI refresh.
          [[ "$GITHUB_REF_NAME" == "main" ]] || exit 0
          [[ "$(cat VERSION)" == "1.1.2" ]] || exit 0
          git fetch -q origin tag v1.1.2
          changed="$(git diff --name-only v1.1.2 HEAD)"
          [[ -n "$changed" ]] || exit 0
          while IFS= read -r file; do
            case "$file" in
              web/index.html|web/app.js|web/workspace.css|app/test_workspace_tiles.py|tests/test_main_overview.cjs|.github/workflows/publish-private-images.yml) ;;
              *) echo "Not a visual-only refresh: $file"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "UI-only refresh authorized for mutable stable image"
      - name: Generate one-app image tags
        id: tags
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          name="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/auto-trade"
          {
            echo "list<<EOF"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$name:$GITHUB_REF_NAME"
              echo "$name:stable"
            else
              if [[ "$GITHUB_REF_NAME" == "feature/truenas-running-baseline" ]]; then
                echo "$name:truenas-baseline"
                echo "$name:truenas-baseline-${GITHUB_SHA::12}"
              else
                echo "$name:candidate"
              fi
              if [[ "${{ steps.visual.outputs.stable }}" == "true" ]]; then
                echo "$name:stable"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish one unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.unified
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=One-image Auto Trader with first-run web setup
          provenance: false
