# Paste into TrueNAS Apps > Discover > Custom App via YAML.
# Replace POOL_NAME before saving, or choose your own existing persistent dataset.
# One TrueNAS app, one container and one image; all modules are inside.
services:
  auto-trader:
    image: ghcr.io/zoncko98/auto-trade:stable
    restart: unless-stopped
    init: true
    ports:
      - "8765:8765"
    environment:
      AUTO_UNIFIED_APP: "true"
      STATE_DIR: /state
      LOG_DIR: /logs
    volumes:
      - /mnt/POOL_NAME/auto-trader/state:/state
      - /mnt/POOL_NAME/auto-trader/logs:/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD","python","-c","import ssl,urllib.request;urllib.request.urlopen('https://127.0.0.1:8765/health',context=ssl._create_unverified_context(),timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
