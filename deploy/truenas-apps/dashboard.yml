services:
  dashboard:
    image: ghcr.io/zoncko98/auto-trade-dashboard:stable
    container_name: trading-dashboard
    restart: unless-stopped
    init: true
    env_file:
      - /mnt/POOL_NAME/trading-bot/config/dashboard.env
    environment:
      STATE_DIR: /state
      DASHBOARD_LOCAL_AI_URL: http://OLLAMA_LAN_IP:11434
      DASHBOARD_PORT: "8765"
      DASHBOARD_TLS_CERT: /tls/cert.pem
      DASHBOARD_TLS_KEY: /tls/key.pem
    ports:
      - "NAS_LAN_IP:8765:8765"
    volumes:
      - /mnt/POOL_NAME/trading-bot/state:/state
      - /mnt/POOL_NAME/trading-bot/config/dashboard-tls:/tls:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://127.0.0.1:8765/health',timeout=4,context=ssl._create_unverified_context()).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
